<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QuickNotes API Client</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
  </head>
  <body>
    <main class="container">
      <header>
        <h1>QuickNotes</h1>
        <p>A small client for trying the JSONPlaceholder posts API.</p>
      </header>

      <section aria-labelledby="notes-heading">
        <div class="section-heading">
          <h2 id="notes-heading">Your notes</h2>
          <button id="load-btn" type="button">Load notes</button>
        </div>
        <p id="status" role="status" aria-live="polite">Load notes to fetch them from the server.</p>
        <ul id="notes-list" aria-label="Notes"></ul>
      </section>

      <section aria-labelledby="create-heading">
        <h2 id="create-heading">Create a note</h2>
        <form id="note-form">
          <div class="field">
            <label for="title-input">Title <span>(required, up to 100 characters)</span></label>
            <input id="title-input" name="title" type="text" maxlength="100" required>
          </div>
          <div class="field">
            <label for="body-input">Body <span>(optional)</span></label>
            <textarea id="body-input" name="body" rows="4"></textarea>
          </div>
          <button id="submit-btn" type="submit">Create note</button>
        </form>
      </section>
    </main>
  </body>
</html>
